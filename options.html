<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Ultimate Tab Limiter</title>
  <link
    href="options.css"
    rel="stylesheet"
  />
</head>

<body>
  <div class="container">
    <header>
      <h1>Ultimate Tab Limiter</h1>
      <p>Smartly manage your tabs and boost productivity.</p>
    </header>
  
    <!-- Global Tab Limit -->
    <section class="card highlight">
      <h2>🌐 Global Limit</h2>
      <div class="field-row">
        <label for="globalLimit">Max Tabs Across All Domains</label>
        <input
          type="number"
          id="globalLimit"
          placeholder="e.g. 15"
        />
      </div>
    </section>
  
    <!-- Domain-specific tab limits -->
    <section class="card">
      <h2>📑 Domain Rules</h2>
      <div class="form-grid">
        <div class="field">
          <label for="domain">Domain</label>
          <input
            type="text"
            id="domain"
            placeholder="example.com"
          />
        </div>
        <div class="field">
          <label for="number">Allowed Tabs</label>
          <input
            type="number"
            id="number"
            placeholder="e.g. 5"
          />
        </div>
      </div>
      <button
        id="addEntryBtn"
        class="primary"
      >➕ Add Rule</button>
      </section>
      
      <!-- Tab Closing Behavior -->

                    id="closeNewTabs"
          >
          <span class="slider"></span>

        </label>

          >
          <span class="slider"></span>

        </label>
      </div>
    </section> -->

    <!-- Entries List -->
    <section class="card">
      <h2>📋 Active Rules</h2>
      <ul
        id="entriesList"
        class="entries"
      >
        <li class="header">
          <span>Domain</span>
          <span>Allowed</span>
          <span>Open</span>
          <span></span>
        </li>
        <!-- Example entry -->
        <!--

                                                </li>
                                                -->
      </ul>
    </section>
    </div>
    <script src="options.js"></script>
